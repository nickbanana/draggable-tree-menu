<div cdkDropListGroup class="listBoundary">
  <ul ngTree #tree="ngTree" class="basic-tree" cdkDropList [cdkDropListData]="mutableNodes" (cdkDropListDropped)="drop($event)">
    <ng-template
      [ngTemplateOutlet]="treeNodes"
      [ngTemplateOutletContext]="{nodes: mutableNodes, parent: tree}"
    />
  </ul>
</div>
<ng-template #treeNodes let-nodes="nodes" let-parent="parent">
  @for (node of nodes; track node.id) {
    <li
      ngTreeItem
      cdkDrag
      [cdkDragData]="node.id"
      cdkDragBoundary=".listBoundary"
      [parent]="parent"
      [value]="node.id"
      [label]="node.name"
      [disabled]="node.disabled"
      [(expanded)]="node.expanded"
      #treeItem="ngTreeItem"
    >
      <span
        aria-hidden="true"
        class="material-symbols-outlined expand-icon"
        translate="no"
        >{{node.menus ? 'chevron_right' : ''}}</span
      >
      <span
        aria-hidden="true"
        class="material-symbols-outlined"
        translate="no"
        >{{node.menus ? 'folder' : 'docs'}}</span
      >
      {{ node.name }}
    </li>
    @if (node.menus) {
      <ul role="group" cdkDropList (cdkDropListDropped)="drop($event)">
        <ng-template ngTreeItemGroup [ownedBy]="treeItem" #group="ngTreeItemGroup">
          <ng-template
            [ngTemplateOutlet]="treeNodes"
            [ngTemplateOutletContext]="{nodes: node.menus, parent: group}"
          />
        </ng-template>
      </ul>
    }
  }
</ng-template>
